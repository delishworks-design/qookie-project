<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A1B12">
<title>KAPEtid — Barista</title>
<style>
  :root{--bg:#F6EFE5;--paper:#FFFDF9;--ink:#2A1B12;--muted:#8A7462;--line:#E8DED1;--accent:#C98E52;--ok:#5A7A4A;--info:#3B6E8C;--warn:#B45309}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  button,input{font:inherit;color:inherit}button{cursor:pointer}[hidden]{display:none!important}
  .bar{position:sticky;top:0;z-index:20;background:var(--ink);color:#FFFDF9;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .bar b{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:22px;letter-spacing:-.04em}
  .bar small{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#C9B7A4}
  .bar .spacer{flex:1}
  .pill{background:var(--accent);color:#FFFDF9;border:0;border-radius:999px;padding:8px 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:14px;padding:14px;align-items:start}
  .col{min-width:0}
  .tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
  .tab{min-height:44px;padding:0 18px;border:1px solid var(--line);background:var(--paper);border-radius:999px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
  .tab.on{background:var(--ink);border-color:var(--ink);color:#FFFDF9}
  .order{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:10px}
  .order.new{border-left-color:var(--warn)}.order.preparing{border-left-color:var(--info)}.order.ready{border-left-color:var(--ok)}
  .order-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .num{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:24px;letter-spacing:-.04em}
  .tag{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);text-transform:uppercase;letter-spacing:.06em}
  .tag.new{background:#FBF0DF;color:var(--warn);border-color:#EBD3A9}
  .tag.preparing{background:#E6F0F5;color:var(--info);border-color:#C6DBE6}
  .tag.ready{background:#EAF1E5;color:var(--ok);border-color:#CBDDC0}
  .items{font-size:15px;line-height:1.6;margin:10px 0}
  .meta{font-size:12px;color:var(--muted);margin-bottom:10px}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .acts button{min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .acts button.go{background:var(--accent);border-color:var(--accent);color:#FFFDF9}
  .acts button.done{background:var(--ink);border-color:var(--ink);color:#FFFDF9}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:70px;max-height:calc(100dvh - 86px);overflow-y:auto}
  .panel h2{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:21px;margin:0 0 10px}
  #recipeSearch{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;margin-bottom:10px;font-size:15px}
  .chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
  .chip{min-height:36px;padding:0 12px;border:1px solid var(--line);background:var(--paper);border-radius:999px;font-size:12px;white-space:nowrap}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#FFFDF9}
  .recipe{font-size:13px;line-height:1.7;background:var(--bg);border-radius:10px;padding:12px;margin-top:10px}
  .recipe h3{font-size:15px;margin:10px 0 4px;font-weight:700}
  .recipe h3:first-child{margin-top:0}
  .recipe b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:8px}
  .recipe ul,.recipe ol{margin:5px 0 8px;padding-left:22px}
  .recipe li{margin-bottom:4px}
  .rlist{display:flex;flex-wrap:wrap;gap:6px}
  .rlist button{min-height:36px;padding:0 10px;border:1px solid var(--line);background:var(--paper);border-radius:8px;font-size:12px}
  .rlist button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--paper));font-weight:700}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#FFFDF9;padding:10px 18px;border-radius:999px;font-size:13px;z-index:60}
  @media(min-width:600px){
    body{font-size:15px}
    .bar{padding:14px 20px}.bar b{font-size:26px}.pill{min-height:46px;font-size:14px}
    main{grid-template-columns:minmax(0,1.2fr) minmax(340px,.8fr);gap:18px;padding:18px}
    .tab{min-height:52px;padding:0 22px;font-size:15px}
    .order{padding:18px;margin-bottom:14px}
    .num{font-size:28px}.items{font-size:17px}.meta{font-size:14px}
    .acts button{min-height:50px;padding:0 18px;font-size:14px}
    .panel{padding:18px;top:84px;max-height:calc(100dvh - 100px)}
    .panel h2{font-size:24px}
    #recipeSearch{min-height:52px;font-size:16px}
    .chip{min-height:42px;padding:0 16px;font-size:14px}
    .rlist button{min-height:44px;padding:0 14px;font-size:14px}
    .recipe{font-size:15px}
  }
  @media(max-width:599px){main{grid-template-columns:1fr}.panel{position:static;max-height:none}.bar b{font-size:19px}}
</style>
</head>

<div class="bar"><b>KAPEtid</b><small>Barista</small><span class="spacer"></span><span id="clock" style="font-size:12px"></span><button class="pill" id="refresh" type="button">Refresh</button></div>
<main>
  <div class="col">
    <div class="tabs" id="tabs">
      <button class="tab on" type="button" data-tab="new">New</button>
      <button class="tab" type="button" data-tab="preparing">Preparing</button>
      <button class="tab" type="button" data-tab="ready">Ready</button>
      <button class="tab" type="button" data-tab="done">Done</button>
    </div>
    <div id="orders"></div>
  </div>
  <div class="col">
    <div class="panel">
      <h2>Recipes</h2>
      <input id="recipeSearch" placeholder="Find a drink…">
      <div class="chips" id="chips">
        <button class="chip on" type="button" data-cat="all">All</button>
        <button class="chip" type="button" data-cat="coffee">Coffee</button>
        <button class="chip" type="button" data-cat="noncoffee">Non-Coffee</button>
        <button class="chip" type="button" data-cat="bestseller">Best Seller</button>
        <button class="chip" type="button" data-cat="frappe">Frappe</button>
        <button class="chip" type="button" data-cat="refresher">Refresher</button>
      </div>
      <div class="rlist" id="rlist"></div>
      <div class="recipe" id="recipe">Tap a drink to see its procedure.</div>
    </div>
  </div>
</main>
<div id="toast" hidden></div>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(function(){t.hidden=true},2200)}
function pad(n){return '#'+String(n).padStart(3,'0')}
var orders=[],statuses={},tab='new',recipeCat='all',selected='',sbAt='',sbAtExp=0;
async function sbToken(){
  if(sbAt&&Date.now()<sbAtExp)return sbAt;
  var r=await fetch('https://vggaswbjsmyvfheofnnj.supabase.co/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:SB_QREF})});
  if(!r.ok)throw new Error('offline');var j=await r.json();sbAt=j.access_token;sbAtExp=Date.now()+(j.expires_in-60)*1000;return sbAt;
}
async function sbRow(){
  var at=await sbToken();
  var r=await fetch('https://vggaswbjsmyvfheofnnj.supabase.co/rest/v1/bloom_data?select=doc,rev&user_id=eq.'+SB_QKU,{headers:{apikey:SB_KEY,Authorization:'Bearer '+at}});
  if(!r.ok)throw new Error('read failed');var a=await r.json(),row=a[0]||{doc:{},rev:0};return {doc:row.doc||{},rev:Number(row.rev)||0};
}
async function sbSetStatus(uid,st){
  var at=await sbToken(),row=await sbRow(),doc=row.doc||{};
  var ss=Object.assign({},doc.statuses||{});ss[String(uid)]={status:st,statusAt:new Date().toISOString()};
  var r=await fetch('https://vggaswbjsmyvfheofnnj.supabase.co/rest/v1/bloom_data?user_id=eq.'+SB_QKU+'&rev=eq.'+row.rev,{method:'PATCH',headers:{apikey:SB_KEY,Authorization:'Bearer '+at,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({doc:Object.assign({},doc,{statuses:ss}),rev:row.rev+1})});
  if(!r.ok)throw new Error('status failed');
  try{await fetch('https://vggaswbjsmyvfheofnnj.supabase.co/realtime/v1/api/broadcast',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({topic:'qookie-orders',event:'status',payload:{uid:uid,status:st,statusAt:ss[uid].statusAt},priv:false})})}catch(e){}
  statuses=ss;
}
function statusOf(o){var s=statuses[String(o.uid)];return s?s.status:(o.status||'pending')}
function load(){
  return fetch(RAW+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    orders=(j&&(j.orders||(j.state&&j.state.orders)))||[];
    return sbRow().then(function(row){
      statuses=row.doc.statuses||{};
      var known={};orders.forEach(function(o){known[String(o.uid)]=true});
      (row.doc.orders||[]).forEach(function(o){if(o&&o.uid&&!known[String(o.uid)]){orders.unshift(o);known[String(o.uid)]=true}});
      orders.sort(function(a,b){return new Date(b.ts||0)-new Date(a.ts||0)});
      render();
    }).catch(function(){render()});
  }).catch(function(){render()});
}
function itemNames(o){return (o.items||[]).map(function(i){return i.name+' × '+i.qty}).join(', ')||'—'}
function findRecipe(name){
  var hit=CATALOG.find(function(p){return p.name===name||name&&(p.name.toLowerCase()===name.toLowerCase())});
  if(hit&&PROCEDURES[hit.id])return {id:hit.id,name:hit.name,cat:hit.cat};
  var keys=Object.keys(PROCEDURES);
  var k=keys.find(function(id){var p=CATALOG.find(function(x){return x.id===id});return p&&p.name.toLowerCase()===String(name).toLowerCase()});
  if(k)return {id:k,name:name,cat:(CATALOG.find(function(x){return x.id===k})||{}).cat||''};
  return null;
}
function render(){
  var groups={new:[],preparing:[],ready:[],done:[]};
  orders.forEach(function(o){var st=statusOf(o);if(st==='pending')groups.new.push(o);else if(st==='preparing')groups.preparing.push(o);else if(st==='ready')groups.ready.push(o);else groups.done.push(o)});
  groups.done.sort(function(a,b){return new Date(b.ts)-new Date(a.ts)});
  var list=groups[tab];
  $('orders').innerHTML=list.length?list.map(function(o){
    var st=statusOf(o),cls=st==='pending'?'new':st;
    var acts=st==='pending'?'<button class="go" data-act="preparing" type="button">Start</button>':
      st==='preparing'?'<button class="go" data-act="ready" type="button">Ready</button>':
      '<button class="done" data-act="done" type="button">Done</button>';
    return '<div class="order '+cls+'" data-uid="'+esc(o.uid)+'">'+
      '<div class="order-head"><span class="num">'+pad(o.id)+'</span><span class="tag '+cls+'">'+esc(st)+'</span>'+
      (o.table?'<span class="tag">Table '+esc(o.table)+'</span>':'')+(o.mode?'<span class="tag">'+esc(o.mode)+'</span>':'')+'</div>'+
      '<div class="items">'+esc(itemNames(o))+'</div>'+
      (o.customer?'<div class="meta">For '+esc(o.customer)+'</div>':'')+
      (o.notes?'<div class="meta">'+esc(o.notes)+'</div>':'')+
      '<div class="acts">'+acts+'<button data-act="recipe" type="button">Recipe</button></div></div>';
  }).join(''):'<div class="order">Nothing here.</div>';
}
function renderRecipes(){
  var q=($('recipeSearch').value||'').toLowerCase();
  var list=CATALOG.filter(function(p){return (recipeCat==='all'||p.cat===recipeCat)&&(!q||p.name.toLowerCase().indexOf(q)>-1)&&PROCEDURES[p.id]});
  $('rlist').innerHTML=list.map(function(p){return '<button type="button" data-recipe="'+esc(p.id)+'" class="'+(selected===p.id?'on':'')+'">'+esc(p.name)+'</button>'}).join('')||'<span style="font-size:12px;color:var(--muted)">No recipe found</span>';
}
function showRecipe(id){
  selected=id;renderRecipes();
  var blocks=PROCEDURES[id]||[];
  if(!blocks.length){$('recipe').textContent='No published procedure. Follow the counter standard.';return}
  $('recipe').innerHTML=blocks.map(function(b){
    return '<h3>'+esc(b.name)+'</h3><b>Ratio</b><ul>'+b.ratio.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+
      '</ul><b>Procedure</b><ol>'+b.steps.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>';
  }).join('');
}
$('tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;[].forEach.call(this.querySelectorAll('.tab'),function(x){x.classList.toggle('on',x===b)});render()});

$('refresh').addEventListener('click',function(){load();toast('Refreshed')});
$('orders').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var card=b.closest('.order'),uid=card&&card.dataset.uid,o=orders.find(function(x){return String(x.uid)===String(uid)});if(!o)return;
  if(b.dataset.act==='recipe'){
    var names=(o.items||[]).map(function(i){return i.name});
    var found=null;names.forEach(function(n){if(!found)found=findRecipe(n)});
    if(found){showRecipe(found.id);var pn=document.querySelector('.panel');if(pn&&pn.scrollIntoView)pn.scrollIntoView({behavior:'smooth'})}
    else{$('recipe').textContent='No published procedure for: '+names.join(', ')}
    return;
  }
  sbSetStatus(o.uid,b.dataset.act).then(function(){o.status=b.dataset.act;render();toast('Order '+pad(o.id)+' → '+b.dataset.act)}).catch(function(e){toast(e.message)});
});

  var c=$('clock');if(c)c.textContent=new Date().toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'});
},1000);

renderRecipes();load();
